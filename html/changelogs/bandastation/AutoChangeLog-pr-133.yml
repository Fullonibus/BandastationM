author: "Nlaysi"
delete-after: True
changes:
  - balance: "Посох Асклепия больше не выпадает из обычного и демонического лавалендского дропа."
  - balance: "Дефибрилляторы Nanotrasen/ЕРТ получили обычные медицинские ограничения, съёмную конечную батарею и перезарядку 5 секунд. Устройство и его содержимое защищены от ЭМИ."
  - balance: "Бейсбольные биты больше не отбрасывают противников и не отбивают летящих мобов. Бита ЦК сохраняет прежнее поведение."