changes:
  - qol: "Призраки по умолчанию сохраняют полупрозрачную внешность тела с одеждой. При входе через «Наблюдать» используется выбранный персонаж из меню."
  - qol: "В настройке «Призрак: форма» можно выбрать внешность персонажа или обычного призрака без подписки BYOND."