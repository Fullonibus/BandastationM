author: "mo0niverse"
delete-after: True
changes:
  - balance: "Под автоматически тормозит при отпускании клавиш движения. Кнопка «Тормоз челнока» увеличивает предельную тормозную тягу на треть."
  - rscadd: "Под можно припарковать и зафиксировать после полной остановки. У пилота на парковке и пассажиров в полёте доступны руки."
  - rscadd: "Пассажира можно высадить через «Состояние челнока» или перетащив разблокированный под на себя снаружи."
  - rscadd: "Фабрикатор подов печатает батареи. Снятые маяки можно подписывать мультитулом для отображения на консоли."
  - qol: "Пилот стреляет ЛКМ по карте. Назначения клавиш HUD сохраняются между посадками."
  - qol: "Турбо и дополнительные системы доступны в окне «Состояние челнока»."
  - bugfix: "Команда шлюза отсека управляет ближайшей группой одноимённых шлюзов или локальными шаттерсами и бластдверями с общим ID."