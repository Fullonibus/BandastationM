author: "mo0niverse"
delete-after: True
changes:
  - rscadd: "Добавлены стационарные телефоны с адресной связью между отделами, телефонной книгой и историей звонков. Телефон можно заказать через карго."
  - rscadd: "Добавлены настенные таксофоны с оплатой картой или монетой; занятые и неотвеченные вызовы не расходуют оплаченный звонок."
  - map: "Телефоны размещены на Cyberiad, MetaStation и ЦК."
  - sound: "Добавлены звонки и сигналы стационарных телефонов."
  - bugfix: "Сигналы телефона прекращаются сразу после возврата трубки; снятие и укладывание сопровождаются щелчком, а кнопка завершения вызова — тремя гудками."
  - qol: "Снятую телефонную трубку можно положить на пол и передать другому персонажу, сохраняя разговор в пределах длины шнура."
  - qol: "Натянутый телефонный шнур останавливает движение, не возвращая трубку к телефону и не обрывая разговор."