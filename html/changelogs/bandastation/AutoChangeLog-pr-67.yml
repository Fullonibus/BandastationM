author: "mo0niverse"
delete-after: True
changes:
  - balance: "Касания подом до 3 клеток/с безопасны; урон более быстрых столкновений снижен."
  - rscadd: "Поды повреждают и проламывают обычные и укреплённые стены и стёкла, с трещинами и возможностью ремонта."
  - rscadd: "Пилоты получают урон и переломы при сильных столкновениях пода."
  - rscadd: "Поды сбивают людей при быстром наезде; урон зависит от скорости и учитывает броню."
  - bugfix: "Каркас пода можно собирать и разбирать со всех сторон корпуса 2×2."