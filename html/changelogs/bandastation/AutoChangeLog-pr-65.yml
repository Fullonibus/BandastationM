changes:
  - bugfix: "Поды сохраняют плавное инерционное движение при возвращении в гравитацию, со сниженной скоростью в ангаре."
  - bugfix: "Внутри пода отключено MOD-меню по Ctrl+нажатию колёсика и применение направленных MOD-модулей через корпус."
  - balance: "Урон подов от столкновений снижен вдвое с сохранением зависимости от скорости."
  - bugfix: "Турели руин обнаруживают поды с враждебным живым экипажем и стреляют по корпусу."